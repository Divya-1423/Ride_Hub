
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ride Hub - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #111827,
                #2563eb
            );
        }

        .login-card {
            width: 90%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #2563eb;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 25px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #1f2937;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 17px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #111827,
                #2563eb
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .register {
            text-align: center;

            margin-top: 20px;

            font-size: 14px;

            color: #64748b;
        }

        .register a {
            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .success {
            background: #dcfce7;

            color: #15803d;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 18px;

            font-size: 14px;
        }

    </style>

</head>


<body>

    <div class="login-card">

        <div class="logo">
            🚕 RIDE HUB
        </div>

        <div class="subtitle">
            Login to compare your rides
        </div>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <!-- ACCOUNT CREATED MESSAGE -->

        {% if registered == "1" %}

        <div class="success">
            Account created successfully!
            Please login.
        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <label>
                📧 Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                🔒 Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                🔐 Login
            </button>

        </form>


        <!-- REGISTER LINK -->

        <div class="register">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>

    </div>

</body>

</html>
